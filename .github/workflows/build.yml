name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version
        shell: bash
        run: echo "${{ steps.version.outputs.version }}" > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build with PyInstaller
        run: pyinstaller ERA.spec --noconfirm

      - name: Build MSI installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -File installer\build_msi.ps1 -Version ${{ steps.version.outputs.version }} -OutDir artifact
          Get-ChildItem artifact

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir artifact
          ditto -c -k --sequesterRsrc --keepParent dist/ERA.app artifact/ERA-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ERA-${{ matrix.label }}
          path: artifact/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.msi
            artifacts/*.zip
