name: Build executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Create macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s resources/images/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) resources/images/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o icone_ERA.icns

      - name: Build with PyInstaller
        run: pyinstaller ERA.spec --noconfirm

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ERA -DestinationPath ERA-${{ matrix.label }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ERA.app ERA-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ERA-${{ matrix.label }}
          path: ERA-${{ matrix.label }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
